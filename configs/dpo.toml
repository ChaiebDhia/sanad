# Preference tuning on failure-mode pairs. Run AFTER merging the SFT adapter
# (python train/merge_adapter.py ...) and point base_model at the merged folder.
[model]
base_model = "runs/sft-merged"

[data]
train = "data/dpo.train.jsonl"

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = "all-linear"

[train]
output_dir = "runs/dpo"
epochs = 1
learning_rate = 5e-6
beta = 0.1
per_device_batch_size = 1
grad_accum = 16
max_length = 2048
seed = 42
report_to = "mlflow"
